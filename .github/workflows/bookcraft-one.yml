name: BOOKCRAFT ONE MVP checks

on:
  push:
    branches: [main, codex/universal-bot-crm]
    paths:
      - "DZ_9_BOOKCRAFT_ONE/**"
      - ".github/workflows/bookcraft-one.yml"
  pull_request:
    paths:
      - "DZ_9_BOOKCRAFT_ONE/**"
      - ".github/workflows/bookcraft-one.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DZ_9_BOOKCRAFT_ONE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DZ_9_BOOKCRAFT_ONE/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: node build-static.cjs
