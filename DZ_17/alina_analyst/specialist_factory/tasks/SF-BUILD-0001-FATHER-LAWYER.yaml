  preserve_unknowns: true
  preserve_contradictions: true
  currentness_required: true
  cross_specialist_protocol_required: true
  emergency_update_protocol_required: true

required_outputs:
  - PROFESSION_DOSSIER
  - SOURCE_REGISTER
  - EVIDENCE_REGISTER
  - CONTRADICTION_REGISTER
  - PROFESSIONAL_TEMPLATE
  - EVIDENCE_GRAPH
  - COMPETENCY_MAP
  - CURRICULUM
  - LEARNING_GRAPH
  - KNOWLEDGE_SOURCE_PLAN
  - KNOWLEDGE_PACKAGE
  - LEGAL_SPECIALIZATION_MAP
  - CROSS_SPECIALIST_INTERFACES
  - SPECIALIST_INTERACTION_ALGORITHMS
  - DIGITAL_SPECIALIST_PACKAGE
  - EVALUATION_PROFILE
  - EVALUATION_REPORT
  - BENCHMARK_RESULTS
  - GAP_REGISTER
  - IMPROVEMENT_PLAN
  - REGRESSION_REPORT
  - QUALIFICATION_STATE
  - APPROVAL_RECORD
  - RELEASE_RECORD
  - AUDIT_TRAIL

release_gates:
  professional_template_psa_approved: required
  provenance_complete_for_material_claims: required
  unseen_evaluation: required
