version: '0.1'
models:
  qwen3_embedding:
    type: embedding
    enabled: true
    capabilities:
    - knowledge.embed
    load_policy: persistent
    status: discovered
  qwen3_reranker:
    type: reranker
    enabled: true
    capabilities:
    - knowledge.rerank
    load_policy: persistent
    status: discovered
  local_llm:
    type: llm
    enabled: true
    capabilities:
    - text.generate
    - image.analyze
    load_policy: persistent
    status: ready
    provider: ollama
    model: qwen3-vl:8b-instruct-q4_K_M
    endpoint: http://127.0.0.1:11434
  faster_whisper:
    type: stt
    enabled: true
    capabilities:
    - speech.to_text
    load_policy: on_demand
    status: ready
    provider: faster-whisper
    model: small
    device: cpu
    compute_type: int8
  local_tts:
    type: tts
    enabled: true
    capabilities:
    - speech.synthesize
    load_policy: on_demand
    status: ready
    provider: pyttsx3
  comfyui:
    type: image
    enabled: true
    capabilities:
    - image.generate
    load_policy: on_demand
    status: ready
    provider: comfyui
    endpoint: http://127.0.0.1:8188
    checkpoint: realvisxlV50_v50LightningBakedvae.safetensors
